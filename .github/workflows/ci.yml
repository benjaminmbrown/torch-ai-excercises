# Torch.AI — DevOps Engineer Exercise
# CI/CD Pipeline: Build, Scan (Trivy), Test, Deploy
# Base image: RHEL UBI 9.5 (ubi9/python-311)

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: torch-sitrep-parser
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─── BUILD ─────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./sitrep-parser
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Load for local scan even on PRs
          load: true

  # ─── SECURITY SCAN ─────────────────────────────────────────────────────────
  scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scanning (PR context)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./sitrep-parser
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan

      - name: Run Trivy — CRITICAL/HIGH vulnerabilities (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.event_name == 'pull_request' && format('{0}:scan', env.IMAGE_NAME) || needs.build.outputs.image }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Run Trivy — Full scan to SARIF (informational)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.event_name == 'pull_request' && format('{0}:scan', env.IMAGE_NAME) || needs.build.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Run Trivy — Filesystem scan (Python deps)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./sitrep-parser
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0  # informational only for dep scan

  # ─── TEST ──────────────────────────────────────────────────────────────────
  test:
    name: API & Pipeline Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install -r countries-pipeline/requirements.txt

      - name: Run QA test suite
        run: |
          pytest countries-pipeline/test_api.py \
            -v \
            --html=test-report.html \
            --self-contained-html \
            --tb=short \
            -k "not performance"
        # Skip perf tests in CI (network variability); run locally with full suite

      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report.html
          retention-days: 30

      - name: Run SITREP parser smoke test
        run: |
          pip install -r sitrep-parser/requirements.txt
          cd sitrep-parser
          # Start app in background, wait for health check
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          curl -f http://127.0.0.1:8000/health
          curl -f http://127.0.0.1:8000/events | python3 -c "import json,sys; data=json.load(sys.stdin); assert len(data)==5, f'Expected 5 seed events, got {len(data)}'"
          echo "SITREP parser smoke test passed"
          kill %1

  # ─── DEPLOY ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, scan, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via Docker Compose (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/torch-exercises
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ needs.build.outputs.image }}
            IMAGE_TAG=${{ github.sha }} docker-compose up -d sitrep-parser
            # Verify healthy
            sleep 10
            docker-compose ps | grep sitrep-parser | grep "healthy"
            echo "Deployment successful: ${{ github.sha }}"

      - name: Post-deploy smoke test
        run: |
          sleep 15
          curl -f ${{ secrets.STAGING_URL }}/health
          echo "Staging health check passed"
